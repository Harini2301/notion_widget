<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Frame-Options" content="allowall">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid #b8b4e8;
    background: #f0eff9;
    color: #4a4580;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  a:hover {
    background: #e4e2f5;
    border-color: #9d99d8;
  }
  .icon { font-size: 16px; }
</style>
</head>
<body>
  <a href="https://app.notion.com/p/Operations-Dashboard-34e97f6f6aba8128b7cac6545123a56f?source=copy_link">
    <span class="icon">🛰️</span>
    Operations Dashboard
  </a>
</body>
</html>
