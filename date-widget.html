<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    height: 100vh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-left: 4px;
  }
  .date {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .day-name {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9b9690;
  }
  .day-num {
    font-size: 28px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1;
  }
  .month-year {
    font-size: 22px;
    font-weight: 400;
    color: #1a1a1a;
  }
</style>
</head>
<body>
<div class="date">
  <span class="day-name" id="dayName"></span>
  <span class="day-num" id="dayNum"></span>
  <span class="month-year" id="monthYear"></span>
</div>
<script>
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const d = new Date();
  document.getElementById('dayName').textContent = days[d.getDay()];
  document.getElementById('dayNum').textContent = String(d.getDate()).padStart(2,'0');
  document.getElementById('monthYear').textContent = months[d.getMonth()] + ' ' + d.getFullYear();
</script>
</body>
</html>
