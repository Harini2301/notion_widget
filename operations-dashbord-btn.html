
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:'Inter',sans-serif;
}

body{
  padding:10px;
}

.nuvah-btn{

  width:320px;

  text-decoration:none;
  color:#2d2d2d;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 14px;

  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.92),
      rgba(244,241,237,0.95)
    );

  border:1px solid #ddd8d1;

  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 4px 10px rgba(0,0,0,0.03);

  transition:all .2s ease;
}

.nuvah-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 2px 6px rgba(0,0,0,0.05),
    0 8px 18px rgba(0,0,0,0.05);
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-wrap{
  width:26px;
  height:26px;

  border-radius:8px;

  background:#f8f6f3;

  border:1px solid #e7e2db;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
}

.text{
  font-size:14px;
  font-weight:600;
}

.arrow{
  font-size:11px;
  color:#9b958d;
}

</style>
</head>

<body>

<a
  class="nuvah-btn"
  href="https://www.notion.so/Operations-Dashboard-34e97f6f6aba8128b7cac6545123a56f?source=copy_link"
  target="_blank"
>

  <div class="left">

    <div class="icon-wrap">📡</div>

    <div class="text">
      Operations Dashboard
    </div>

  </div>

  <div class="arrow">↗</div>

</a>

</body>
</html>
