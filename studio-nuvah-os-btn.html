<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:24px;
  background:transparent;
  font-family:'Inter',sans-serif;
}

.nuvah-btn{

  width:320px;

  text-decoration:none;
  color:#2c2c2c;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 18px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.88),
      rgba(245,243,240,0.92)
    );

  border:1px solid rgba(215,210,203,0.9);

  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 8px 24px rgba(0,0,0,0.05);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    background .22s ease;
}

.nuvah-btn:hover{

  transform:translateY(-3px);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.98),
      rgba(241,238,234,0.98)
    );

  box-shadow:
    0 4px 10px rgba(0,0,0,0.06),
    0 16px 34px rgba(0,0,0,0.08);
}

.left{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-wrap{

  width:40px;
  height:40px;

  border-radius:14px;

  background:#f7f5f2;

  border:1px solid #e5e0d9;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.7);
}

.text{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:18px;
  font-weight:600;
  letter-spacing:-0.02em;
}

.subtitle{
  font-size:12px;
  color:#8c877f;
  margin-top:3px;
}

.arrow{

  font-size:15px;
  color:#9d988f;

  transition:transform .22s ease;
}

.nuvah-btn:hover .arrow{
  transform:translateX(2px);
}

</style>
</head>

<body>

<a
  class="nuvah-btn"
  href="https://www.notion.so/Studio-Nuvah-OS-34e97f6f6aba817199c9d26457fbe5ff?source=copy_link"
  target="_blank"
>

  <div class="left">

    <div class="icon-wrap">
      🪐
    </div>

    <div class="text">
      <div class="title">Studio Nuvah OS</div>
      <div class="subtitle">Workspace portal</div>
    </div>

  </div>

  <div class="arrow">
    ↗
  </div>

</a>

</body>
</html>
