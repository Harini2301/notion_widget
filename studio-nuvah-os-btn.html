<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:transparent;
  font-family:'Inter',sans-serif;
}

.nuvah-btn{

  width:260px;

  text-decoration:none;
  color:#2d2d2d;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 14px;

  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.92),
      rgba(244,241,237,0.95)
    );

  border:1px solid #ddd8d1;

  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 6px 18px rgba(0,0,0,0.04);

  transition:all .22s ease;
}

.nuvah-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 3px 8px rgba(0,0,0,0.05),
    0 10px 22px rgba(0,0,0,0.06);
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-wrap{

  width:30px;
  height:30px;

  border-radius:10px;

  background:#f8f6f3;

  border:1px solid #e7e2db;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:14px;
}

.text{
  font-size:15px;
  font-weight:600;
  letter-spacing:-0.02em;
}

.arrow{
  font-size:13px;
  color:#9b958d;

  transition:transform .22s ease;
}

.nuvah-btn:hover .arrow{
  transform:translateX(2px);
}

</style>
</head>

<body>

<a
  class="nuvah-btn"
  href="https://www.notion.so/Studio-Nuvah-OS-34e97f6f6aba817199c9d26457fbe5ff?source=copy_link"
  target="_blank"
>

  <div class="left">

    <div class="icon-wrap">
      🪐
    </div>

    <div class="text">
      Studio Nuvah OS
    </div>

  </div>

  <div class="arrow">
    ↗
  </div>

</a>

</body>
</html>
