<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:8px;
  background:transparent;
  font-family:'Inter',sans-serif;
}

.nuvah-btn{

  width:fit-content;

  text-decoration:none;
  color:#2d2d2d;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 12px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.92),
      rgba(244,241,237,0.95)
    );

  border:1px solid #ddd8d1;

  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 4px 10px rgba(0,0,0,0.03);

  transition:all .2s ease;
}

.nuvah-btn:hover{

  transform:translateY(-1px);

  box-shadow:
    0 2px 6px rgba(0,0,0,0.05),
    0 8px 18px rgba(0,0,0,0.05);
}

.icon-wrap{

  width:24px;
  height:24px;

  border-radius:8px;

  background:#f8f6f3;

  border:1px solid #e7e2db;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
}

.text{
  font-size:14px;
  font-weight:600;
  letter-spacing:-0.02em;
}

.arrow{
  font-size:11px;
  color:#9b958d;
  margin-left:2px;
}

</style>
</head>

<body>

<a
  class="nuvah-btn"
  href="https://www.notion.so/36d97f6f6aba81928ac9f7345cee51dc?v=36d97f6f6aba819cb738000cbfbf5990&source=copy_link"
  target="_blank"
>

  <div class="icon-wrap">
    📈
  </div>

  <div class="text">
    Weekly Status Log
  </div>

  <div class="arrow">
    ↗
  </div>

</a>

</body>
</html>
